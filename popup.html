<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>PageLoom</title>
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-icon" src="icons/icon48.png" alt="">
        <div>
          <p class="eyebrow">PAGELOOM</p>
          <h1>Capture every scroll</h1>
        </div>
      </header>

      <p class="intro">Save the complete current page as one continuous file.</p>

      <section class="format-picker" aria-label="Choose a download format">
        <button class="format-card png-card" data-format="png">
          <span class="format-icon">▧</span>
          <span class="format-copy"><strong>PNG image</strong><small>Lossless · largest file</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <button class="format-card webp-card" data-format="webp">
          <span class="format-icon">◈</span>
          <span class="format-copy"><strong>WebP image</strong><small>Compact · full-page export</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <button class="format-card pdf-card" data-format="pdf">
          <span class="format-icon">▤</span>
          <span class="format-copy"><strong>PDF document</strong><small>One continuous page</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
      <button id="cancel" class="cancel" type="button" hidden>Cancel capture</button>

      <footer class="trust-note">
        <span class="trust-mark">✓</span>
        <span>Local processing · No uploads</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
